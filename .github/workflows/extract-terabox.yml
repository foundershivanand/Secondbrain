name: 🧠 Cloud 100GB Ideas Extraction

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of items to extract in this run'
        required: true
        default: '30'
        type: string
      type_filter:
        description: 'Filter by file type'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - pdf
          - screenshot
          - video
          - voice
      keyword_filter:
        description: 'Keyword filter (e.g. Ideas, Design, Book, or leave blank for next pending)'
        required: false
        default: ''
        type: string

  # Runs in background every 6 hours automatically (uncomment to enable continuous extraction)
  # schedule:
  #   - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  extract:
    name: ⚡ Extract Ideas with Gemini
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🚀 Run AI Knowledge Extraction
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          GITHUB_BRANCH: 'main'
        run: |
          BATCH="${{ github.event.inputs.batch_size || '30' }}"
          TYPE="${{ github.event.inputs.type_filter || 'all' }}"
          KEYWORD="${{ github.event.inputs.keyword_filter || '' }}"

          CMD="node scripts/terabox-importer.mjs terabox-manifest.json --limit $BATCH --type $TYPE"
          if [ -n "$KEYWORD" ]; then
            CMD="$CMD --filter $KEYWORD"
          fi

          echo "Running extraction: $CMD"
          eval $CMD

      - name: 💾 Commit & Push New Notes to Vault
        run: |
          git config --global user.name "Second Brain Cloud Bot"
          git config --global user.email "cloud-bot@secondbrain.internal"
          git add vault/ terabox-progress.json
          if git diff --staged --quiet; then
            echo "ℹ️ No new notes or progress updates to commit."
          else
            git commit -m "cloud: extracted ideas batch [skip ci]"
            git push origin main
            echo "✅ Successfully synced newly extracted notes to GitHub main branch!"
          fi
