name = "second-brain-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "second_brain"
database_id = "da4f5160-5bdd-49b9-bd47-1da08fe1bad4"

# Nightly Memory Consolidation Agent trigger (2:00 AM UTC daily)
[triggers]
crons = ["0 2 * * *"]

[vars]
ENVIRONMENT = "development"
VAULT_NAME = "second-brain-vault"
